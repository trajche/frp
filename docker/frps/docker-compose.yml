services:
  frps:
    build:
      context: ../..
      dockerfile: docker/frps/Dockerfile
    image: trajche/frps:latest
    container_name: frps
    restart: unless-stopped
    ports:
      - "7000:7000"      # frp bind port
      - "7500:7500"      # dashboard
      - "80:80"          # vhost HTTP (required for ACME)
      - "443:443"        # vhost HTTPS
    volumes:
      - ./frps.toml:/etc/frp/frps.toml:ro
      - frps-acme:/var/lib/frps/acme
    environment:
      - TZ=UTC

volumes:
  frps-acme:
